<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conteggio magazzino</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; padding: 12px; max-width: 520px; }
  /* Banner come l'intestazione di magazzinioz.it: stesso blu, logo preso dal sito. Largo quanto lo schermo */
  html { overflow-x: hidden; } /* 100vw include la barra di scorrimento del PC: niente scorrimento orizzontale */
  #banner { background: #283a88; margin: -12px calc(50% - 50vw) 12px; padding: 12px 16px; text-align: center; }
  #banner img { height: 48px; width: auto; display: inline-block; vertical-align: middle; }
  #pronto { margin-top: 8px; padding: 16px; border-radius: 8px; background: #dcfce7; color: #166534; font-size: 18px; text-align: center; }
  #pronto.ferma { background: #fee2e2; color: #991b1b; }
  input, select, #annulla { font-size: 18px; padding: 12px; width: 100%; box-sizing: border-box; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  #operatore.manca { border: 2px solid #dc2626; }
  #annulla { background: #b91c1c; color: #fff; border: 0; }
  #annulla:disabled { background: #ddd; color: #888; }
  #ultimo { margin-top: 8px; font-weight: 600; }
  #stato { font-size: 14px; color: #555; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
  td.codice b, td.codice button { display: block; }
  button.rif { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: #1d4ed8; text-decoration: underline; cursor: pointer; text-align: left; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #overlay.aperto { display: flex; }
  #overlay .scheda { background: #fff; border-radius: 12px; padding: 12px; width: 100%; max-width: 480px; text-align: center; }
  #overlay img { display: block; margin: 0 auto; max-width: 100%; max-height: 60vh; object-fit: contain; }
  #overlay .attesa { padding: 60px 0; color: #555; }
  #overlay .chiudi { margin-top: 8px; font-size: 14px; color: #555; }
  td.codice small { color: #6b7280; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #aggiorna { font-size: 16px; padding: 12px; width: 100%; margin-top: 24px; border-radius: 8px; border: 1px solid #1d4ed8; background: #fff; color: #1d4ed8; }
  #aggiorna:disabled { color: #888; border-color: #ccc; }
  #login h2 { margin: 16px 0 4px; font-size: 20px; }
  #lEntra { font-size: 18px; padding: 12px; width: 100%; margin-top: 12px; border-radius: 8px; border: 0; background: #283a88; color: #fff; }
  #lEntra:disabled { background: #888; }
  #lErrore { color: #b91c1c; margin-top: 8px; min-height: 1.2em; }
  #chi { margin-top: 12px; text-align: center; font-size: 14px; color: #555; }
  #esci { background: none; border: 0; padding: 0; font: inherit; color: #1d4ed8; text-decoration: underline; cursor: pointer; }
  tr.ignoto td { color: #c2410c; }
  .cestino { font-size: 20px; padding: 4px 8px; background: none; border: 0; cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 18px; border-radius: 8px;
           color: #fff; font-size: 18px; opacity: 0; transition: opacity .2s; max-width: 90%; text-align: center; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <header id="banner"><img src="https://www.magazzinioz.it/web/image/website/1/logo/MagazziniOz" alt="Magazzini OZ"></header>
  <form id="login" hidden>
    <h2>Accesso</h2>
    <input id="lUtente" placeholder="Utente" autocomplete="username" autocapitalize="off" required>
    <input id="lPassword" type="password" placeholder="Password" autocomplete="current-password" required>
    <button id="lEntra" type="submit">Entra</button>
    <div id="lErrore" role="alert"></div>
  </form>
  <main id="app" hidden>
  <select id="operatore" aria-label="Operatore"><option value="">Caricamento operatori…</option></select>
  <div id="pronto"></div>
  <input id="manuale" placeholder="Codice a mano + Invio" autocomplete="off" inputmode="numeric">
  <button id="annulla" disabled>Rimuovi ultimo registrato</button>
  <div id="ultimo"></div>
  <div id="stato"></div>
  <table>
    <thead><tr><th>Codice / Barcode</th><th>Nome</th><th></th></tr></thead>
    <tbody id="lista"></tbody>
  </table>
  <button id="aggiorna">Aggiorna prodotti da Odoo</button>
  <div id="chi"><span id="chiNome"></span> · <button id="esci" type="button">Esci</button></div>
  </main>
  <div id="toast" role="status"></div>
  <div id="overlay" role="dialog" aria-modal="true" aria-label="Foto prodotto">
    <div class="scheda"><div id="ovFoto"></div><div id="ovTesto"></div><div class="chiudi">Tocca per chiudere</div></div>
  </div>

<script>
// Lettura solo con pistola barcode (Bluetooth o USB, modalità tastiera HID): la fotocamera del telefono è stata
// tolta il 21/11/2026 perché leggeva male (codici fantasma, fuoco da vicino). La pistola "scrive" il codice e manda Invio.

// URL /exec del deployment Apps Script. Nessun segreto in questa pagina (è pubblica su GitHub Pages):
// i dati escono solo con una sessione ottenuta da login con utente e password, verificati dallo script
const API = 'https://script.google.com/macros/s/AKfycbxvEbtEbtpLr5Q3kPAF-66nbd_Rid6VP0mpg4CTzVWjIBuHur9LbnacZtIehrfcgEqa/exec';
const NUOVO = '__nuovo__'; // valore della voce "+ Aggiungi operatore"

const $ = id => document.getElementById(id);
let sessione = '', utente = '';
try { sessione = localStorage.getItem('sessione') || ''; utente = localStorage.getItem('utente') || ''; } catch (e) {}

// Body stringa = text/plain: richiesta "semplice", niente preflight CORS verso Apps Script.
// Sessione scaduta o non valida: torna la schermata di accesso (le letture in coda restano e partono dopo il login)
async function api(dati) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ sessione, ...dati }) });
  const j = await r.json();
  if (!j.ok) {
    const err = new Error(j.errore);
    if (j.login) { err.login = true; mostraLogin(j.errore); }
    throw err;
  }
  return j;
}

function mostraLogin(messaggio) {
  sessione = '';
  try { localStorage.removeItem('sessione'); } catch (_) {}
  $('app').hidden = true;
  $('login').hidden = false;
  $('lErrore').textContent = messaggio || '';
  $('lUtente').value = $('lUtente').value || utente;
}

$('login').onsubmit = async e => {
  e.preventDefault();
  $('lEntra').disabled = true;
  $('lErrore').textContent = '';
  try {
    const j = await api({ azione: 'login', utente: $('lUtente').value, password: $('lPassword').value });
    sessione = j.sessione; utente = j.utente;
    try { localStorage.setItem('sessione', sessione); localStorage.setItem('utente', utente); } catch (_) {}
    $('lPassword').value = '';
    avvia();
  } catch (err) {
    $('lErrore').textContent = err.message;
  }
  $('lEntra').disabled = false;
};

$('esci').onclick = () => {
  if (coda.length && !confirm(`Ci sono ${coda.length} letture non ancora inviate al foglio: se esci restano sul telefono e partono al prossimo accesso. Uscire?`)) return;
  mostraLogin('');
};

// Dopo l'accesso: si mostra l'app e si caricano anagrafica e operatori; le letture rimaste in coda ripartono
function avvia() {
  $('login').hidden = true;
  $('app').hidden = false;
  $('chiNome').textContent = 'Accesso: ' + utente;
  api({ azione: 'prodotti' })
    .then(j => { prodotti = j.prodotti; riferimenti = j.riferimenti || {}; aggiornaStato(); })
    .catch(e => { if (!e.login) toast('Errore caricamento anagrafica: ' + e.message, '#b91c1c'); });
  api({ azione: 'operatori' })
    .then(j => { riempiOperatori(j.operatori, opPrecedente); cambiaOperatore(); })
    .catch(e => { if (!e.login) toast('Errore caricamento operatori: ' + e.message, '#b91c1c'); });
  invia();
}
// miei = letture dell'operatore scelto (tabella), dalla più vecchia alla più recente: quelle già nel foglio
// (anche da altri telefoni) più quelle nuove di questo telefono
let prodotti = {}, riferimenti = {}, coda = [], inviando = false, miei = [], caricando = false;

const operatore = () => { const v = $('operatore').value; return v === NUOVO ? '' : v; };
let opPrecedente = '';
try { opPrecedente = localStorage.getItem('operatore') || ''; } catch (e) {}

// Menu: "Scegli operatore", operatori del foglio in ordine alfabetico, "+ Aggiungi operatore"
function riempiOperatori(elenco, scelto) {
  const sel = $('operatore');
  sel.replaceChildren(new Option('— Scegli operatore —', ''),
    ...elenco.slice().sort((a, b) => a.localeCompare(b, 'it')).map(n => new Option(n, n)),
    new Option('+ Aggiungi operatore', NUOVO));
  sel.value = elenco.includes(scelto) ? scelto : '';
}

$('operatore').onchange = async e => {
  e.target.blur(); // il menu non resta selezionato: le cifre della pistola non cambierebbero operatore
  if (e.target.value !== NUOVO) return cambiaOperatore();
  const nome = (prompt('Nome del nuovo operatore') || '').trim();
  if (!nome) { e.target.value = opPrecedente; return; }
  try {
    const j = await api({ azione: 'aggiungiOperatore', nome });
    // se il nome c'era già (maiuscole a parte) si sceglie quello del foglio
    riempiOperatori(j.operatori, j.operatori.find(n => n.toLowerCase() === nome.toLowerCase()));
    toast(`Operatore ${operatore()} aggiunto`);
  } catch (err) {
    toast('Operatore non salvato: ' + err.message, '#b91c1c');
    e.target.value = opPrecedente;
  }
  cambiaOperatore();
};

// Scelto un operatore: la tabella si ricarica con tutte le sue letture già nel foglio
async function cambiaOperatore() {
  const op = operatore();
  opPrecedente = op;
  try { localStorage.setItem('operatore', op); } catch (_) {}
  miei = [];
  caricando = !!op;
  aggiornaStato();
  if (!op) return;
  try {
    const j = await api({ azione: 'scansioni', op });
    if (op !== operatore()) return; // nel frattempo è stato scelto un altro operatore
    const nelFoglio = new Set(j.scansioni.map(x => x.id));
    const daCancellare = new Set(coda.filter(x => x.tipo === 'del').map(x => x.s.id));
    miei = j.scansioni.filter(x => !daCancellare.has(x.id)).map(x => ({ ...x, op }))
      // letture di questo telefono non ancora arrivate al foglio
      .concat(coda.filter(x => x.tipo === 'add' && x.s.op === op && !nelFoglio.has(x.s.id)).map(x => x.s));
  } catch (e) {
    toast('Errore caricamento letture: ' + e.message, '#b91c1c');
  }
  caricando = false;
  aggiornaStato();
}

function toast(msg, colore) {
  const t = $('toast');
  t.textContent = msg;
  t.style.background = colore || '#15803d';
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1800);
}

function aggiornaStato() {
  const manca = !operatore();
  $('operatore').classList.toggle('manca', manca);
  $('pronto').classList.toggle('ferma', manca);
  $('pronto').textContent = manca ? 'Scegli l\'operatore per iniziare' : 'Pronto: spara i codici con la pistola';
  const u = miei[miei.length - 1];
  $('ultimo').textContent = u ? 'Ultimo: ' + (u.nome || prodotti[u.codice] || u.codice) : '';
  $('stato').textContent = caricando ? 'Caricamento letture dell\'operatore…'
    : `Scansioni: ${miei.length} · Da inviare: ${coda.length}`;
  $('annulla').disabled = !miei.length;

  // Tabella, la lettura più recente in alto. Codice e nome dall'anagrafica. textContent: niente HTML dal foglio
  $('lista').replaceChildren(...miei.slice().reverse().map(s => {
    const nome = s.nome || prodotti[s.codice] || '';
    const tr = document.createElement('tr');
    if (!nome) tr.className = 'ignoto';
    const tdCod = tr.insertCell();
    tdCod.className = 'codice';
    // prodotto in anagrafica: il codice è un pulsante che apre la foto grande
    const rif = document.createElement(nome ? 'button' : 'b'), bc = document.createElement('small');
    rif.textContent = riferimenti[s.codice] || (nome ? 'Foto' : '—');
    if (nome) {
      rif.className = 'rif';
      rif.onclick = e => { e.currentTarget.blur(); apriFoto(s.codice, nome); };
    }
    bc.textContent = s.codice;
    tdCod.append(rif, bc);
    tr.insertCell().textContent = nome || 'Non in anagrafica';
    const b = document.createElement('button');
    b.className = 'cestino';
    b.textContent = '🗑';
    b.setAttribute('aria-label', 'Elimina ' + (nome || s.codice));
    b.onclick = e => {
      e.currentTarget.blur();
      if (confirm(`Sei sicuro di voler eliminare questa lettura?\n\n${s.codice}  ${nome || 'Non in anagrafica'}`)) elimina(s);
    };
    tr.insertCell().append(b);
    return tr;
  }));
}

// Overlay con la foto (image_512 da Odoo), chiesta a ogni tocco del codice: niente miniature, niente cache (scelta di Luca)
async function apriFoto(codice, nome) {
  const box = $('ovFoto');
  $('ovTesto').textContent = `${riferimenti[codice] || ''}  ${codice}  —  ${nome}`;
  $('overlay').classList.add('aperto');
  const mostra = url => {
    if (!$('overlay').classList.contains('aperto') || $('overlay').dataset.codice !== codice) return; // chiuso o cambiato
    if (url) { const img = document.createElement('img'); img.src = url; img.alt = nome; box.replaceChildren(img); }
    else { const d = document.createElement('div'); d.className = 'attesa'; d.textContent = 'Nessuna foto in Odoo'; box.replaceChildren(d); }
  };
  $('overlay').dataset.codice = codice;
  const d = document.createElement('div');
  d.className = 'attesa';
  d.textContent = 'Caricamento foto…';
  box.replaceChildren(d);
  try { mostra((await api({ azione: 'fotoGrande', codice })).foto); }
  catch (e) { box.textContent = 'Foto non disponibile: ' + e.message; }
}
const chiudiFoto = () => $('overlay').classList.remove('aperto');
$('overlay').onclick = chiudiFoto;
document.addEventListener('keydown', e => { if (e.key === 'Escape') chiudiFoto(); });

// Pulsante in fondo: riscrive subito la scheda Prodotti da Odoo (come l'aggiornamento notturno) e ricarica l'anagrafica
$('aggiorna').onclick = async e => {
  const b = e.currentTarget;
  b.blur();
  b.disabled = true;
  b.textContent = 'Aggiornamento da Odoo in corso…';
  try {
    const n = (await api({ azione: 'aggiornaProdotti' })).prodotti;
    const j = await api({ azione: 'prodotti' });
    prodotti = j.prodotti; riferimenti = j.riferimenti || {};
    aggiornaStato();
    toast(`Prodotti aggiornati da Odoo: ${n}`);
  } catch (err) {
    toast('Aggiornamento non riuscito: ' + err.message, '#b91c1c');
  }
  b.disabled = false;
  b.textContent = 'Aggiorna prodotti da Odoo';
};

// Nessuna attesa tra letture: ogni sparo è un pezzo, anche lo stesso codice più volte di fila
function registra(codice) {
  codice = String(codice).trim();
  // UPC-A: secondo l'impostazione della pistola arriva a 12 cifre o a 13 con lo 0 davanti. In anagrafica è a 12
  // cifre e nessun EAN-13 inizia per 0: si toglie lo 0, così ogni pistola scrive lo stesso codice
  if (/^0\d{12}$/.test(codice)) codice = codice.slice(1);
  if (!codice) return;
  if (!operatore()) { // obbligatorio: la lettura non viene registrata
    toast('Lettura NON registrata: scegli prima l\'operatore', '#b91c1c');
    if (navigator.vibrate) navigator.vibrate([100, 60, 100]);
    return;
  }

  const nome = prodotti[codice] || '';
  const s = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), codice, nome, op: operatore() };
  miei.push(s);
  coda.push({ tipo: 'add', s });
  if (navigator.vibrate) navigator.vibrate(80);
  if (nome) toast(`${nome} Aggiunto`);
  else toast(`Codice ${codice} non in anagrafica — Aggiunto`, '#c2410c');
  aggiornaStato();
  invia();
}

// Cancella una lettura qualsiasi della tabella: se è ancora in coda basta toglierla, altrimenti si cancella dal foglio
function elimina(s) {
  const k = miei.indexOf(s);
  if (k < 0) return;
  miei.splice(k, 1);
  const i = coda.findIndex(x => x.tipo === 'add' && x.s.id === s.id);
  if (i > -1 && !(inviando && i === 0)) coda.splice(i, 1);
  else coda.push({ tipo: 'del', s });
  toast(`${s.nome || prodotti[s.codice] || s.codice} Rimosso`, '#b91c1c');
  aggiornaStato();
  invia();
}

$('annulla').onclick = e => {
  e.currentTarget.blur(); // il pulsante non resta selezionato: l'Invio della pistola non lo ripremerebbe
  if (miei.length) elimina(miei[miei.length - 1]);
};

// Una scrittura alla volta, in ordine. Se la rete cade si ritenta ogni 3 s senza perdere nulla
function invia() {
  if (inviando || !coda.length) return;
  inviando = true;
  const x = coda[0];
  api(x.tipo === 'add'
      ? { azione: 'aggiungi', id: x.s.id, codice: x.s.codice, nome: x.s.nome, op: x.s.op }
      : { azione: 'rimuovi', id: x.s.id })
    .then(() => { coda.shift(); inviando = false; aggiornaStato(); invia(); })
    // sessione scaduta: si aspetta il nuovo accesso (avvia() richiama invia); altrimenti si ritenta tra 3 s
    .catch(e => { inviando = false; aggiornaStato(); if (!e.login) setTimeout(invia, 3000); });
}

window.addEventListener('beforeunload', e => { if (coda.length) { e.preventDefault(); e.returnValue = ''; } });

// Codice scritto a mano nel campo
$('manuale').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  registra(e.target.value);
  e.target.value = '';
});

// Pistola: si ricevono i tasti ovunque sia il cursore, senza toccare un campo (niente tastiera a schermo).
// Si ignora solo il campo del codice a mano. Fine codice: Invio, o Tab per le pistole impostate così.
// Sul menu operatori i tasti vengono bloccati: le cifre farebbero scegliere un altro operatore.
// ponytail: buffer azzerato dopo 500 ms senza tasti, la pistola scrive un codice intero in pochi ms
let buffer = '', ultimoTasto = 0;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const ora = Date.now();
  if (ora - ultimoTasto > 500) buffer = '';
  ultimoTasto = ora;
  if (e.key === 'Enter' || e.key === 'Tab') {
    if (!buffer) return;
    e.preventDefault(); // niente clic su un pulsante selezionato (anche i cestini), niente salto di campo
    registra(buffer);
    buffer = '';
  } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.target.tagName === 'SELECT') e.preventDefault();
    buffer += e.key;
  }
});

aggiornaStato();
if (sessione) avvia(); else mostraLogin('');
</script>
</body>
</html>
