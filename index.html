<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conteggio magazzino</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; padding: 12px; max-width: 520px; }
  #pronto { margin-top: 8px; padding: 16px; border-radius: 8px; background: #dcfce7; color: #166534; font-size: 18px; text-align: center; }
  #pronto.ferma { background: #fee2e2; color: #991b1b; }
  input, select, #annulla { font-size: 18px; padding: 12px; width: 100%; box-sizing: border-box; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  #operatore.manca { border: 2px solid #dc2626; }
  #annulla { background: #b91c1c; color: #fff; border: 0; }
  #annulla:disabled { background: #ddd; color: #888; }
  #ultimo { margin-top: 8px; font-weight: 600; }
  #stato { font-size: 14px; color: #555; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
  td.barcode { font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.ignoto td { color: #c2410c; }
  .cestino { font-size: 20px; padding: 4px 8px; background: none; border: 0; cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 18px; border-radius: 8px;
           color: #fff; font-size: 18px; opacity: 0; transition: opacity .2s; max-width: 90%; text-align: center; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <select id="operatore" aria-label="Operatore"><option value="">Caricamento operatori…</option></select>
  <div id="pronto"></div>
  <input id="manuale" placeholder="Codice a mano + Invio" autocomplete="off" inputmode="numeric">
  <button id="annulla" disabled>Rimuovi ultimo registrato</button>
  <div id="ultimo"></div>
  <div id="stato"></div>
  <table>
    <thead><tr><th>Barcode</th><th>Codice</th><th>Nome</th><th></th></tr></thead>
    <tbody id="lista"></tbody>
  </table>
  <div id="toast" role="status"></div>

<script>
// Lettura solo con pistola barcode (Bluetooth o USB, modalità tastiera HID): la fotocamera del telefono è stata
// tolta il 21/11/2026 perché leggeva male (codici fantasma, fuoco da vicino). La pistola "scrive" il codice e manda Invio.

// Incollare l'URL /exec del deployment Apps Script e lo stesso TOKEN di Code.gs
const API = 'https://script.google.com/macros/s/AKfycbxvEbtEbtpLr5Q3kPAF-66nbd_Rid6VP0mpg4CTzVWjIBuHur9LbnacZtIehrfcgEqa/exec';
const TOKEN = 'HgrnQ_nEDDeixZ2O';
const NUOVO = '__nuovo__'; // valore della voce "+ Aggiungi operatore"

// Body stringa = text/plain: richiesta "semplice", niente preflight CORS verso Apps Script
async function api(dati) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ token: TOKEN, ...dati }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.errore);
  return j;
}

const $ = id => document.getElementById(id);
// miei = letture dell'operatore scelto (tabella), dalla più vecchia alla più recente: quelle già nel foglio
// (anche da altri telefoni) più quelle nuove di questo telefono
let prodotti = {}, riferimenti = {}, coda = [], inviando = false, miei = [], caricando = false;

const operatore = () => { const v = $('operatore').value; return v === NUOVO ? '' : v; };
let opPrecedente = '';
try { opPrecedente = localStorage.getItem('operatore') || ''; } catch (e) {}

api({ azione: 'prodotti' })
  .then(j => { prodotti = j.prodotti; riferimenti = j.riferimenti || {}; aggiornaStato(); })
  .catch(e => toast('Errore caricamento anagrafica: ' + e.message, '#b91c1c'));

// Menu: "Scegli operatore", operatori del foglio in ordine alfabetico, "+ Aggiungi operatore"
function riempiOperatori(elenco, scelto) {
  const sel = $('operatore');
  sel.replaceChildren(new Option('— Scegli operatore —', ''),
    ...elenco.slice().sort((a, b) => a.localeCompare(b, 'it')).map(n => new Option(n, n)),
    new Option('+ Aggiungi operatore', NUOVO));
  sel.value = elenco.includes(scelto) ? scelto : '';
}

api({ azione: 'operatori' })
  .then(j => { riempiOperatori(j.operatori, opPrecedente); cambiaOperatore(); })
  .catch(e => toast('Errore caricamento operatori: ' + e.message, '#b91c1c'));

$('operatore').onchange = async e => {
  e.target.blur(); // il menu non resta selezionato: le cifre della pistola non cambierebbero operatore
  if (e.target.value !== NUOVO) return cambiaOperatore();
  const nome = (prompt('Nome del nuovo operatore') || '').trim();
  if (!nome) { e.target.value = opPrecedente; return; }
  try {
    const j = await api({ azione: 'aggiungiOperatore', nome });
    // se il nome c'era già (maiuscole a parte) si sceglie quello del foglio
    riempiOperatori(j.operatori, j.operatori.find(n => n.toLowerCase() === nome.toLowerCase()));
    toast(`Operatore ${operatore()} aggiunto`);
  } catch (err) {
    toast('Operatore non salvato: ' + err.message, '#b91c1c');
    e.target.value = opPrecedente;
  }
  cambiaOperatore();
};

// Scelto un operatore: la tabella si ricarica con tutte le sue letture già nel foglio
async function cambiaOperatore() {
  const op = operatore();
  opPrecedente = op;
  try { localStorage.setItem('operatore', op); } catch (_) {}
  miei = [];
  caricando = !!op;
  aggiornaStato();
  if (!op) return;
  try {
    const j = await api({ azione: 'scansioni', op });
    if (op !== operatore()) return; // nel frattempo è stato scelto un altro operatore
    const nelFoglio = new Set(j.scansioni.map(x => x.id));
    const daCancellare = new Set(coda.filter(x => x.tipo === 'del').map(x => x.s.id));
    miei = j.scansioni.filter(x => !daCancellare.has(x.id)).map(x => ({ ...x, op }))
      // letture di questo telefono non ancora arrivate al foglio
      .concat(coda.filter(x => x.tipo === 'add' && x.s.op === op && !nelFoglio.has(x.s.id)).map(x => x.s));
  } catch (e) {
    toast('Errore caricamento letture: ' + e.message, '#b91c1c');
  }
  caricando = false;
  aggiornaStato();
}

function toast(msg, colore) {
  const t = $('toast');
  t.textContent = msg;
  t.style.background = colore || '#15803d';
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1800);
}

function aggiornaStato() {
  const manca = !operatore();
  $('operatore').classList.toggle('manca', manca);
  $('pronto').classList.toggle('ferma', manca);
  $('pronto').textContent = manca ? 'Scegli l\'operatore per iniziare' : 'Pronto: spara i codici con la pistola';
  const u = miei[miei.length - 1];
  $('ultimo').textContent = u ? 'Ultimo: ' + (u.nome || prodotti[u.codice] || u.codice) : '';
  $('stato').textContent = caricando ? 'Caricamento letture dell\'operatore…'
    : `Scansioni: ${miei.length} · Da inviare: ${coda.length}`;
  $('annulla').disabled = !miei.length;

  // Tabella, la lettura più recente in alto. Codice e nome dall'anagrafica. textContent: niente HTML dal foglio
  $('lista').replaceChildren(...miei.slice().reverse().map(s => {
    const nome = s.nome || prodotti[s.codice] || '';
    const tr = document.createElement('tr');
    if (!nome) tr.className = 'ignoto';
    for (const [testo, classe] of [[s.codice, 'barcode'], [riferimenti[s.codice] || '—'], [nome || 'Non in anagrafica']]) {
      const td = tr.insertCell();
      td.textContent = testo;
      if (classe) td.className = classe;
    }
    const b = document.createElement('button');
    b.className = 'cestino';
    b.textContent = '🗑';
    b.setAttribute('aria-label', 'Elimina ' + (nome || s.codice));
    b.onclick = e => {
      e.currentTarget.blur();
      if (confirm(`Sei sicuro di voler eliminare questa lettura?\n\n${s.codice}  ${nome || 'Non in anagrafica'}`)) elimina(s);
    };
    tr.insertCell().append(b);
    return tr;
  }));
}

// Nessuna attesa tra letture: ogni sparo è un pezzo, anche lo stesso codice più volte di fila
function registra(codice) {
  codice = String(codice).trim();
  // UPC-A: secondo l'impostazione della pistola arriva a 12 cifre o a 13 con lo 0 davanti. In anagrafica è a 12
  // cifre e nessun EAN-13 inizia per 0: si toglie lo 0, così ogni pistola scrive lo stesso codice
  if (/^0\d{12}$/.test(codice)) codice = codice.slice(1);
  if (!codice) return;
  if (!operatore()) { // obbligatorio: la lettura non viene registrata
    toast('Lettura NON registrata: scegli prima l\'operatore', '#b91c1c');
    if (navigator.vibrate) navigator.vibrate([100, 60, 100]);
    return;
  }

  const nome = prodotti[codice] || '';
  const s = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), codice, nome, op: operatore() };
  miei.push(s);
  coda.push({ tipo: 'add', s });
  if (navigator.vibrate) navigator.vibrate(80);
  if (nome) toast(`${nome} Aggiunto`);
  else toast(`Codice ${codice} non in anagrafica — Aggiunto`, '#c2410c');
  aggiornaStato();
  invia();
}

// Cancella una lettura qualsiasi della tabella: se è ancora in coda basta toglierla, altrimenti si cancella dal foglio
function elimina(s) {
  const k = miei.indexOf(s);
  if (k < 0) return;
  miei.splice(k, 1);
  const i = coda.findIndex(x => x.tipo === 'add' && x.s.id === s.id);
  if (i > -1 && !(inviando && i === 0)) coda.splice(i, 1);
  else coda.push({ tipo: 'del', s });
  toast(`${s.nome || prodotti[s.codice] || s.codice} Rimosso`, '#b91c1c');
  aggiornaStato();
  invia();
}

$('annulla').onclick = e => {
  e.currentTarget.blur(); // il pulsante non resta selezionato: l'Invio della pistola non lo ripremerebbe
  if (miei.length) elimina(miei[miei.length - 1]);
};

// Una scrittura alla volta, in ordine. Se la rete cade si ritenta ogni 3 s senza perdere nulla
function invia() {
  if (inviando || !coda.length) return;
  inviando = true;
  const x = coda[0];
  api(x.tipo === 'add'
      ? { azione: 'aggiungi', id: x.s.id, codice: x.s.codice, nome: x.s.nome, op: x.s.op }
      : { azione: 'rimuovi', id: x.s.id })
    .then(() => { coda.shift(); inviando = false; aggiornaStato(); invia(); })
    .catch(() => { inviando = false; aggiornaStato(); setTimeout(invia, 3000); });
}

window.addEventListener('beforeunload', e => { if (coda.length) { e.preventDefault(); e.returnValue = ''; } });

// Codice scritto a mano nel campo
$('manuale').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  registra(e.target.value);
  e.target.value = '';
});

// Pistola: si ricevono i tasti ovunque sia il cursore, senza toccare un campo (niente tastiera a schermo).
// Si ignora solo il campo del codice a mano. Fine codice: Invio, o Tab per le pistole impostate così.
// Sul menu operatori i tasti vengono bloccati: le cifre farebbero scegliere un altro operatore.
// ponytail: buffer azzerato dopo 500 ms senza tasti, la pistola scrive un codice intero in pochi ms
let buffer = '', ultimoTasto = 0;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const ora = Date.now();
  if (ora - ultimoTasto > 500) buffer = '';
  ultimoTasto = ora;
  if (e.key === 'Enter' || e.key === 'Tab') {
    if (!buffer) return;
    e.preventDefault(); // niente clic su un pulsante selezionato (anche i cestini), niente salto di campo
    registra(buffer);
    buffer = '';
  } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.target.tagName === 'SELECT') e.preventDefault();
    buffer += e.key;
  }
});

aggiornaStato();
</script>
</body>
</html>
